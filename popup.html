<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>NDPD Analytical</title>
    <style>
      body {
        width: 320px;
        min-height: 180px;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #38bdf8;
      }
      p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #94a3b8;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #38bdf8;
        color: #0f172a;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #7dd3fc;
      }
      #output {
        margin-top: 12px;
        padding: 10px;
        border-radius: 6px;
        background: #1e293b;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        white-space: pre-line;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, World! 👋</h1>
      <p>Popup de teste da extensão NDPD Analytical.</p>
      <button id="btn">Testar conexão com a extensão</button>
      <div id="output"></div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
