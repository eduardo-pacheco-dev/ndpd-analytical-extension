<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>NDPd Analytical</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #16213a;
        --panel-2: #1e293b;
        --line: #2b3a55;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 440px;
        max-height: 580px;
        margin: 0;
        overflow-y: auto;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        background: linear-gradient(180deg, #13203a, var(--bg));
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        color: var(--accent);
        letter-spacing: 0.2px;
      }
      .status {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .icon-btn {
        flex: none;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 15px;
        cursor: pointer;
      }
      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      main {
        padding: 12px 14px 6px;
      }
      .hidden {
        display: none !important;
      }
      .error-box {
        margin: 12px 14px;
        padding: 10px 12px;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        background: #2a1215;
        color: #fecaca;
        line-height: 1.45;
      }
      .error-box strong {
        display: block;
        margin-bottom: 4px;
        color: #fca5a5;
      }
      .workorder {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        line-height: 1.45;
      }
      .workorder .wo-title {
        font-size: 14px;
        font-weight: 600;
      }
      .workorder .wo-meta {
        margin-top: 3px;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 10px 0;
      }
      .kpi {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .kpi .num {
        display: block;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
      }
      .kpi .lbl {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .kpi.ok .num {
        color: var(--ok);
      }
      .kpi.err .num {
        color: var(--err);
      }
      .kpi.warn .num {
        color: var(--warn);
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .issue {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 7px 9px;
        margin-bottom: 5px;
        border: 1px solid var(--line);
        border-left-width: 3px;
        border-radius: 6px;
        background: var(--panel);
        line-height: 1.4;
      }
      .issue.error {
        border-left-color: var(--err);
      }
      .issue.warning {
        border-left-color: var(--warn);
      }
      .issue.info {
        border-left-color: var(--accent);
      }
      .issue .tag {
        flex: none;
        margin-top: 1px;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .issue.error .tag {
        background: rgba(248, 113, 113, 0.18);
        color: var(--err);
      }
      .issue.warning .tag {
        background: rgba(251, 191, 36, 0.18);
        color: var(--warn);
      }
      .issue .where {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--muted);
      }
      .section-row {
        padding: 8px 10px;
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .section-row.active {
        border-color: var(--accent);
      }
      .section-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .section-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .section-badge {
        flex: none;
        padding: 1px 7px;
        border-radius: 10px;
        background: var(--panel-2);
        font-size: 11px;
        color: var(--muted);
      }
      .bar {
        height: 4px;
        margin-top: 7px;
        border-radius: 4px;
        background: var(--panel-2);
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: var(--ok);
      }
      .section-note {
        margin-top: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      details.item {
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      details.item > summary {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
        list-style: none;
        line-height: 1.35;
      }
      details.item > summary::-webkit-details-marker {
        display: none;
      }
      details.item[open] > summary {
        border-bottom: 1px solid var(--line);
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.accepted {
        background: var(--ok);
      }
      .dot.rejected {
        background: var(--err);
      }
      .dot.pending {
        background: var(--warn);
      }
      .dot.performed {
        background: var(--accent);
      }
      .item-main {
        flex: 1;
        min-width: 0;
      }
      .item-name {
        display: block;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .item-sub {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 3px;
        font-size: 10px;
        color: var(--muted);
      }
      .pill {
        padding: 1px 6px;
        border-radius: 9px;
        background: var(--panel-2);
      }
      .pill.req {
        color: var(--warn);
      }
      .pill.opt {
        color: var(--muted);
      }
      .item-body {
        padding: 9px 12px;
        font-size: 11.5px;
        line-height: 1.45;
      }
      .kv {
        margin-bottom: 6px;
      }
      .kv .k {
        display: block;
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
      }
      .kv .v {
        overflow-wrap: anywhere;
      }
      .item-body ul {
        margin: 4px 0 8px;
        padding-left: 16px;
      }
      .item-body li {
        margin-bottom: 3px;
      }
      .item-body li.error {
        color: #fecaca;
      }
      .item-body li.warning {
        color: #fde68a;
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }
      .thumb {
        width: 54px;
        height: 54px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        object-fit: cover;
      }
      .empty {
        padding: 10px 12px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }
      footer {
        position: sticky;
        bottom: 0;
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        background: var(--bg);
        border-top: 1px solid var(--line);
      }
      footer button {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      footer button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #0b1220;
      }
      footer button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      footer button:not(:disabled):hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      footer button.primary:not(:disabled):hover {
        background: #7dd3fc;
        color: #0b1220;
      }
      .notes {
        margin: 4px 0 10px;
        padding-left: 16px;
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>NDPd Analytical</h1>
        <span class="status" id="status">Analisando a aba atual…</span>
      </div>
      <button class="icon-btn" id="refresh" title="Reanalisar">↻</button>
    </header>

    <div class="error-box hidden" id="error"></div>

    <main id="result" class="hidden">
      <div class="workorder" id="workorder"></div>
      <div class="kpis" id="kpis"></div>

      <h2>Validações</h2>
      <div id="issues"></div>

      <h2>Seções</h2>
      <div id="sections"></div>

      <h2>Casos de teste coletados</h2>
      <div id="items"></div>

      <h2>Observações</h2>
      <ul class="notes" id="notes"></ul>
    </main>

    <footer>
      <button id="export-json" disabled>JSON</button>
      <button id="export-csv" disabled>CSV</button>
      <button id="analyze-active">Seção atual</button>
      <button id="analyze-all" class="primary">Coletar tudo</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
